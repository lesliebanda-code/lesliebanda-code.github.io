<html>
    <head>
        <meta charset="utf-8">

        <title>homework1</title>

        <!-- Load external CSS styles -->

    </head>

    <body>
        <div id="container">

            <div id="header">
        <table width="100%">
                <tr>
                    <td>
                        <img 
                            id="logo" 
                            src="logo.jpg" 
                            alt="Memorial Family Medicine Logo"
                            width="120"
                        >
                    </td>
                    <td valign="top">
                    <h1> Memorial Family Medicine </h1>
                       <h2> Patient Intake Form</h2>
                        </td>
                    <td valign="bottom" align="right">
                        Today's date: 
                        <span id="today"></span>
                    </td>
                </tr>
            </table>
        </div>
        <hr>
        <form action="thankyou.html">
        <h3> 1. New Account Setup </h3>
            <table>
                <tr>
            <td>
                <label for="userid">Desired User ID:</label>
                </td>
                <td>
                    <input
                    type="text"
                    id="userid"
                    name="userid"
                    maxlength="15"
                    required>
                </td>
                </tr>
                <tr>
                    <td>
            <label for="password">Password:</label> </td>
            <td> 
                <input
                type="password"
                id="password"
                name="password"
                required>
            </td>
                </tr>
            </table>
            <hr>
            <h3>2. Personal Information</h3>
            <table>
            <tr class="form">
                <td align="right">
                    <label for="firstname">First Name</label>
                    </td>
                    <td>
                        <input 
                        type="text"
                        id="firstname"
                        name="firstname"
                        maxlength="30"
                        minlength="2"
                        required> </td>
                    <td>
                        <label for="middleinit">MI</label> </td>
                        <td>
                            <input type="text"
                            maxlength="1"
                            id="middleinit"
                            name="middleinit" > </td>    
                    <td>
                        <label for="lastname">Last Name</label> </td>
                        <td>
                             <input 
                            type="text"
                            maxlength="30"
                            minlength="2"
                            id="lastname"
                            name="lastname"
                           required> </td> 
                    </tr> </table>
                    <table> <tr> <td>
                        <label for="dob">Date of Birth:</label> </td>
                        <td> 
                            <input type="text"
                            id="dob"
                            name="dob"
                            placeholder="MM/DD/YYYY"
                            required>
                        </td>
                        <td> <label for="ssn">Social Security:</label> </td>
                        <td>
                            <input type="password"
                            id="ssn"
                            name="ssn"
                            maxlength="11"
                            placeholder="XXX-XX-XXXX"
                            required> </td>
                            </tr> </table>
                    <table> <tr> <td>
                        <label for="addr1">Address Line 1:</label> </td>
                        <td>
                            <input type="text"
                            id="addr1"
                            name="addr1"
                            size="30"
                            minlength="5"
                            required> </td> </tr>
                         <tr> 
                         <td>
                          <label for="addr2">Address Line 2:</label> </td>
                          <td>
                             <input type="text"
                             id="addr2"
                             name="addr2"
                             size="30"> </td> 
                         </tr> </table>
                    <table> <tr> 
                     <td>
                        <label for="city">City:</label> </td>
                        <td>
                            <input type="text"
                            id="city"
                            name="city"
                            maxlength="30"
                            required>
                            </td>
                         <td>
                            <label for="state">State</label> </td>
                <td> 
                    <select id="state" name="state" required>
                <option value=""></option>
                <option value="AL">Alabama</option>
                <option value="AK">Alaska</option>
                <option value="AZ">Arizona</option>
                <option value="AR">Arkansas</option>
                <option value="CA">California</option>
                <option value="CO">Colorado</option>
                <option value="CT">Connecticut</option>
                <option value="DE">Delaware</option>
                <option value="DC">District Of Columbia</option>
                <option value="FL">Florida</option>
                <option value="GA">Georgia</option>
                <option value="HI">Hawaii</option>
                <option value="ID">Idaho</option>
                <option value="IL">Illinois</option>
                <option value="IN">Indiana</option>
                <option value="IA">Iowa</option>
                <option value="KS">Kansas</option>
                <option value="KY">Kentucky</option>
                <option value="LA">Louisiana</option>
                <option value="ME">Maine</option>
                <option value="MD">Maryland</option>
                <option value="MA">Massachusetts</option>
                <option value="MI">Michigan</option>
                <option value="MN">Minnesota</option>
                <option value="MS">Mississippi</option>
                <option value="MO">Missouri</option>
                <option value="MT">Montana</option>
                <option value="NE">Nebraska</option>
                <option value="NV">Nevada</option>
                <option value="NH">New Hampshire</option>
                <option value="NJ">New Jersey</option>
                <option value="NM">New Mexico</option>
                <option value="NY">New York</option>
                <option value="NC">North Carolina</option>
                <option value="ND">North Dakota</option>
                <option value="OH">Ohio</option>
                <option value="OK">Oklahoma</option>
                <option value="OR">Oregon</option>
                <option value="PA">Pennsylvania</option>
                <option value="RI">Rhode Island</option>
                <option value="SC">South Carolina</option>
                <option value="SD">South Dakota</option>
                <option value="TN">Tennessee</option>
                <option value="TX">Texas</option>
                <option value="UT">Utah</option>
                <option value="VT">Vermont</option>
                <option value="VA">Virginia</option>
                <option value="WA">Washington</option>
                <option value="WV">West Virginia</option>
                <option value="WI">Wisconsin</option>
                <option value="WY">Wyoming</option>
            </select> </td>
            <td> 
                <label for="zip">Zip Code:</label> </td>
                <td> 
                <input type="text"
                name="zip"
                maxlength="8"
                required
                placeholder="#####"> </td>
                </tr> </table>
         <table> <tr>
             <td>
                <label for="phone1">Phone Number:</label> </td>
            <td>
                <input type="text"
                id="phone1"
                name="phone1"
                maxlength="15"
                placeholder="(###)-###-####"
                required> </td>
            <td>
                <label for="email">Email:</label>
                <input type="email"
                id="email"
                maxlength="40"
                placeholder="name@domain.com"
                required> </td>
                </tr> </table>
         <hr>
         <h3>3. Medical Information</h3>
         <table> <tr> 
            <td>
                <label for="height">Height:</label> </td>
            <td>
                <input type="text"
                id="height"> </td>
            <td>
                <label for="weight">Weight:</label> </td>
            <td>
                <input type="text"
                id="weight"
                name="weight"> </td> 
                <td>
                    <label for="gender">Sex:</label> </td>
                <td>
                    <input type="radio"
                    name="msex"
                    value="Male"> <span>Male</span> </td>
                <td> 
                    <input type="radio"
                    name="fsex"
                    value="Female"> <span>Female</span> </td>
                <td> 
                    <input type="radio"
                    name="osex"
                    value="Other"> <span>Other</span> </td>
                </tr> </table>
                <table> <tr>
                    <td align="left">
                     <label for="vaccinated">Are you vaccinated?</label> </td>
                     <td>
                        <input type="radio"
                        name="yes"
                        value="Yes"> <span>Yes</span> </td>
                    <td>
                        <input type="radio"
                        name="no"
                        value="No" <span>No</span> </td>
                        </tr> </table>
                        <table> <tr> 
                    <td align="right">
                         <label for="insurance">Do you have Insurance?</label> </td>
                    <td>
                        <input type="radio"
                        name="yes"
                        value="Yes"> <span>Yes</span> </td> 
                    <td>
                        <input type="radio"
                        name="no"
                        value="No" <span>No</span> </td>
                        </tr> </table>
                    <table> <tr>  
                  <td>
                    <label>Pre-existing Conditions:</label> </td> </tr>
                    <tr> <td>
                        <input type="checkbox"
                        id="diabetes"
                        name="conditions"
                        value="Diabetes">
                        <label for="diabetes">Diabetes</label> </td>
                <td>
                    <input type="checkbox"
                    id="asthma"
                    name="conditions"
                    value="Asthma"> 
                    <label for="asthma">Asthma</label> </td>
                <td> 
                    <input type="checkbox"
                    id="allergies"
                    name="conditions"
                    value="Allergies">
                    <label for="allergies">Allergies</label> </td> </tr>
                    <tr> <td>
                        <input type="checkbox" 
                        id="highbloodpressure"
                        name="conditions" 
                        value="High Blood Pressure">
                        <label for="highbloodpressure">High Blood Pressure</label> </td>
                <td>
                    <input type="checkbox"
                    id="heartdisease"
                    name="conditions"
                    value="Heart Disease">
                    <label for="heartdisease">Heart Disease</label> </td>
                    </tr> </table>
        <table> <tr> 
            <td> 
                <label for="symptoms">Current Symptoms:</label> </td> </tr>
                <tr> <td>
                    <textarea id="symptoms"
                    name="symptoms"
                    rows="3" 
                    placeholder="Describe your current symptoms..."> </textarea>
                    </td> </tr> </table>
                    <table> <tr> 
                        <td>
                            <label for="healthscore">Health Score:</label> </td>
                <td>
                    1
                    <input type="range"
                    id="healthscore"
                    min="1"
                    max="10"
                    value"5">
                    10
                </td> </tr> </table> 
                <hr>
            <h3>4, Emergency Contact</h3>
            <table> <tr> 
                <td> 
                <label for="emergency_name">Emergency Contact Name:</label> </td>
                <td>
                    <input type="text"
                    name="emergency_name"
                    maxlength="30"> </td> 
                <td> 
                    <label for="relationship">Relationship:</label> </td>
                <td>
                    <input type="text"
                    name="relationship"
                    maxlength="15"> </td>
                <td>
                    <label for="emergency_phone">Phone:</label> </td>
                <td>
                    <input type="text"
                    name="emergency_phone"
                    maxlength="15"
                    placeholder="(###)-###-####"> </td> </tr> </table>
            <center>
                <input type="submit"
                value="Submit"> 
                <input type="reset"
                value="CLEAR"> </center> 
                <hr> </form>
                </div>
         <div id="footer"
            <hr>
            <p> Memorial Family Medicine </p> 
            <p> Houston, Tx </p> 
            <button type="button">Contact Us</button>
        </div>

        document.getElementById("today").innerHTML = new Date().toLocaleDateString();
